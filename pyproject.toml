[project]
name = "leap-d"
version = "0.1.0"
description = "Longitudinal ESL Assessment of Proficiency and Disfluency"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "httpx>=0.26.0",
    "numpy>=1.26.3",
    "scipy>=1.12.0",
    "librosa>=0.10.1",
    "soundfile>=0.12.1",
    "jiwer>=3.0.3",
    "pandas>=2.1.4",
    "scikit-learn>=1.4.0",
    "jinja2>=3.1.3",
    "weasyprint>=60.1",
    "pillow>=10.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "httpx>=0.26.0",
    "factory-boy>=3.3.0",
    "faker>=21.0.0",
]

[project.optional-dependencies]
asr = [
    "openai-whisper>=20231117",
    "faster-whisper>=0.10.0",
    "whisperx>=3.1.0",
]
diarization = [
    "pyannote.audio>=3.1.1",
    "torch>=2.1.2",
    "torchaudio>=2.1.2",
]
dev = [
    "ruff>=0.1.13",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
